name: Merge verified Dependabot updates

on:
  workflow_run:
    workflows: [Desktop quality, Continuous Desktop Release]
    types: [completed]
  schedule:
    - cron: '51 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  merge:
    if: >-
      ${{ github.ref == 'refs/heads/main' && (github.repository_id == '1444820071' &&
          github.event.workflow_run.name == 'Desktop quality' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.id == github.event.repository.id) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
      merge_sha: ${{ steps.merge.outputs.merge_sha }}
    concurrency:
      group: dependabot-merge-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      # Run the default-branch helper without PR code, dependency installation or artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - name: Merge only the unchanged Dependabot head after every required job succeeds
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DEPENDABOT_MODE: merge
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: node tools/nx-plugins/repository-tasks/src/executors/dependabot/runDependabotAutomation.mjs

  request-release:
    needs:
      - merge
      - reconcile
    if: ${{ always() && (needs.merge.outputs.merge_sha != '' || needs.reconcile.outputs.merge_sha != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: dependency-release-${{ needs.merge.outputs.merge_sha || needs.reconcile.outputs.merge_sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      # Retain the successful merge output when retrying a failed release request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - name: Request the release for the retained merge source
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_COMMIT_SHA: ${{ needs.merge.outputs.merge_sha }}
          DEPENDABOT_MODE: continue
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RECONCILE_MERGE_SHA: ${{ needs.reconcile.outputs.merge_sha }}
        run: node tools/nx-plugins/repository-tasks/src/executors/dependabot/runDependabotAutomation.mjs

  reconcile:
    if: ${{ github.ref == 'refs/heads/main' && (github.repository_id == '1444820071') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: dependabot-reconcile-${{ github.repository_id }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Refresh branches and resume fully verified native CI
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DEPENDABOT_MODE: reconcile
        run: node tools/nx-plugins/repository-tasks/src/executors/dependabot/runDependabotAutomation.mjs
        id: reconcile
    outputs:
      merge_sha: ${{ steps.reconcile.outputs.merge_sha }}
  authorize:
    needs: reconcile
    if: ${{ always() && github.repository_id == '1444820071' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: dependabot-authorize-${{ github.repository_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Authorize only the current source-proven read-only native CI
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          DEPENDABOT_MODE: authorize
        run: node tools/nx-plugins/repository-tasks/src/executors/dependabot/runDependabotAutomation.mjs
