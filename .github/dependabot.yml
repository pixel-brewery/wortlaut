# Green Dependabot pull requests merge automatically: .github/workflows/dependabot-merge.yml
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    rebase-strategy: auto
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      angular-updates:
        patterns: ['@angular/*', '@angular-devkit/*', '@schematics/*']
      nx-updates:
        patterns: ['@nx/*', 'nx']
      linting-updates:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', '@typescript-eslint/*', 'prettier']
      testing-updates:
        patterns: ['vitest', '@vitest/*', '@playwright/*', 'playwright*', 'jsdom']
      pixel-brewery-mosaik:
        patterns: ['@pixel-brewery/mosaik-*', '@pixel-brewery/markdowner-core']
      pixel-brewery-synapse:
        patterns: ['@pixel-brewery/synapse-*']
      pixel-brewery-platform:
        patterns: ['@pixel-brewery/archipel-*']
      pixel-brewery-ngpel:
        patterns: ['@pixel-brewery/ngpel-*']
      node-types:
        patterns: ['@types/node']

  - package-ecosystem: github-actions
    directory: /
    rebase-strategy: auto
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(ci)'
    groups:
      github-actions-updates:
        patterns: ['*']
