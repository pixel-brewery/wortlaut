name: Suggest a feature
description: Describe a problem Wortlaut should solve.
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what gets in the way, before any solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: The behavior you would expect, and on which surface.
