<nav class="sidebar" aria-label="Main">
  @for (group of presenter.navigation(); track group.label) {
    <div class="sidebar-group">
      <div class="sidebar-label">{{ group.label }}</div>
      @for (item of group.items; track item.route) {
        <a class="sidebar-link" [routerLink]="item.disabled ? null : item.route" [attr.aria-disabled]="item.disabled">
          <mosaik-menu-item
            size="small"
            [label]="item.label"
            [icon]="item.icon"
            [isActive]="item.isActive"
            [disabled]="item.disabled"
          >
            @if (item.count > 0) {
              <mosaik-badge slot="end" appearance="soft" variant="warning" [label]="'' + item.count" />
            }
          </mosaik-menu-item>
        </a>
      }
    </div>
  }
  <div class="sidebar-group sidebar-footer">
    <a class="sidebar-link" routerLink="/settings/workspace">
      <mosaik-menu-item label="Settings" icon="settings" size="small" [isActive]="presenter.settingsActive()" />
    </a>
    <div class="sidebar-version">{{ presenter.versionLabel() }}</div>
  </div>
</nav>
